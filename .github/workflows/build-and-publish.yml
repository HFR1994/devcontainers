name: Build and publish images

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".claude/**"

permissions:
  contents: read
  packages: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history, so we can diff across every commit in the push

      - name: Plan builds
        id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: python3 .github/scripts/plan_builds.py

  build:
    needs: discover
    if: needs.discover.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${OWNER}/${{ matrix.name }}" >> "$GITHUB_ENV"

      # Dump secret to a runner file (creates an empty file if secret is unpopulated)
      - name: Prepare CA secret file
        run: echo "${{ secrets.CUSTOM_CA_PEM }}" > /tmp/ca_secret.pem

      # ---- plain Docker image (Dockerfile at folder root) ----
      - id: meta
        if: matrix.type == 'image'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ matrix.version }}

      - name: Build and push image
        if: matrix.type == 'image'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.folder }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secret-files: |
            MY_CA=/tmp/ca_secret.pem
          cache-from: type=gha,scope=${{ matrix.folder }}
          cache-to: type=gha,mode=max,scope=${{ matrix.folder }}

      # ---- devcontainer (Dockerfile/image under .devcontainer) ----
      - name: Build and push devcontainer
        if: matrix.type == 'devcontainer'
        uses: devcontainers/ci@v0.3
        with:
          subFolder: ${{ matrix.folder }}
          imageName: ${{ env.IMAGE_NAME }}
          imageTag: ${{ matrix.version }},latest
          push: always
